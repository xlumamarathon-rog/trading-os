# Wave 0 infrastructure (spec §2). App/worker services join in later waves.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 5}

  timescaledb:
    # timescaledb-ha bundles TimescaleDB + pgvector (case memory embeddings)
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_dev_only}
      POSTGRES_DB: trading_os
    ports: ["5432:5432"]
    volumes: ["tsdb_data:/home/postgres/pgdata"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U trading"], interval: 5s, timeout: 3s, retries: 10}

volumes:
  tsdb_data:
